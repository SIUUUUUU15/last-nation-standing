<!DOCTYPE html>
<html>
<head>
<title>Last Nation Standing</title>

<style>

body{
background:#0b1020;
color:white;
font-family:Arial;
padding:20px;
}

h1{
color:#22c55e;
}

.card{
background:#1f2937;
padding:20px;
border-radius:10px;
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
border:1px solid #333;
padding:10px;
}

.alive{
color:#22c55e;
font-weight:bold;
}

.out{
color:red;
font-weight:bold;
}

</style>

</head>

<body>

<h1>🏆 LAST NATION STANDING</h1>

<div class="card">
<h2>Rules</h2>

<ul>
<li>Each person draws one country.</li>
<li>If your country is eliminated, you are OUT.</li>
<li>Last country standing wins the pot.</li>
<li>Winner Take All.</li>
</ul>
</div>

<div class="card">
<h2>Players</h2>

<table>

<tr>
<th>Player</th>
<th>Nation</th>
<th>Status</th>
</tr>

<tr>
<td>Abelardo</td>
<td>🇧🇷 Brazil</td>
<td class="alive">ALIVE</td>
</tr>

<tr>
<td>Mike</td>
<td>🇦🇷 Argentina</td>
<td class="alive">ALIVE</td>
</tr>

<tr>
<td>Chris</td>
<td>🇺🇸 USA</td>
<td class="out">ELIMINATED</td>
</tr>

</table>

</div>

</body>
</html>
